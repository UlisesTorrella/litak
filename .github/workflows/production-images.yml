name: Production container images

on:
  push:
    branches: [master]
    paths:
      - app/**
      - conf/**
      - modules/**
      - project/**
      - public/**
      - ui/**
      - build.sbt
      - package.json
      - yarn.lock
      - docker/**
      - .github/workflows/production-images.yml
  workflow_dispatch:
  repository_dispatch:
    types: [litak-ws-updated]

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Litak
        uses: actions/checkout@v5
        with:
          path: litak

      - name: Check out litak-ws
        uses: actions/checkout@v5
        with:
          repository: UlisesTorrella/litak-ws
          path: litak-ws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for Litak
        id: litak-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ulisestorrella/litak
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish Litak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: litak/docker/litak.production.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.litak-meta.outputs.tags }}
          labels: ${{ steps.litak-meta.outputs.labels }}
          cache-from: type=gha,scope=litak-production
          cache-to: type=gha,mode=max,scope=litak-production

      - name: Docker metadata for litak-ws
        id: ws-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ulisestorrella/litak-ws
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish litak-ws
        uses: docker/build-push-action@v6
        with:
          context: .
          file: litak/docker/litak-ws.production.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ws-meta.outputs.tags }}
          labels: ${{ steps.ws-meta.outputs.labels }}
          cache-from: type=gha,scope=litak-ws-production
          cache-to: type=gha,mode=max,scope=litak-ws-production
