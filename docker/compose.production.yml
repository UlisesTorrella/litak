name: litak-production

services:
  mongo:
    image: mongo:5.0.33-focal
    restart: unless-stopped
    command: ["mongod", "--auth", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 768m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo_production_data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_production_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  litak-ws:
    image: ${LITAK_WS_IMAGE:-litak-ws:latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env.production
    expose: ["9664"]
    networks: [backend]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9664'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  litak:
    image: ${LITAK_IMAGE:-litak:latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 1536m
    env_file: .env.production
    expose: ["9663"]
    networks: [backend]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      litak-ws:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9663'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "9664:9664"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      litak:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  mongo_production_data:
  redis_production_data:
  caddy_data:
  caddy_config:
